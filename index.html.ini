
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naaz Cooking | Delicious Recipes</title>

<style>
:root {
  --green: #174b32;
  --orange: #f28b36;
  --cream: #fffaf1;
  --text: #292d27;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--cream);
  color: var(--text);
}

header {
  background: white;
  padding: 16px 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 15px;
  box-shadow: 0 2px 10px #00000010;
}

.logo {
  font-size: 27px;
  font-weight: bold;
  color: var(--green);
}

.logo span { color: var(--orange); }

nav a {
  text-decoration: none;
  color: var(--text);
  margin: 0 10px;
  font-weight: bold;
}

nav a:hover { color: var(--orange); }

.hero {
  padding: 65px 7%;
  min-height: 360px;
  display: flex;
  align-items: center;
  background:
    linear-gradient(90deg, #fff7e9 0%, #fff7e9e8 43%, #fff7e900 100%),
    url("https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=1400&q=85")
    center/cover;
}

.hero-content { max-width: 540px; }

.hero h1 {
  font-size: clamp(38px, 5vw, 60px);
  color: var(--green);
  margin: 0 0 15px;
}

.hero p {
  font-size: 18px;
  line-height: 1.7;
}

.btn {
  display: inline-block;
  background: var(--green);
  color: white;
  padding: 13px 23px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  text-decoration: none;
  font-size: 15px;
}

.btn:hover { background: var(--orange); }

section { padding: 45px 7%; }

.section-title {
  text-align: center;
  color: var(--green);
  font-size: 32px;
  margin: 0 0 10px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 28px;
}

.search-area {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin: 25px auto;
  max-width: 600px;
}

.search-area input {
  flex: 1;
  min-width: 0;
  padding: 14px 18px;
  border: 1px solid #ddd;
  border-radius: 25px;
  font-size: 16px;
}

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 22px 0 30px;
}

.category {
  border: 1px solid #d8dfd3;
  background: white;
  border-radius: 22px;
  padding: 10px 18px;
  cursor: pointer;
}

.category.active,
.category:hover {
  background: var(--green);
  color: white;
}

.recipes {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 24px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 16px #00000012;
  transition: transform .2s;
}

.card:hover { transform: translateY(-4px); }

.card img {
  width: 100%;
  height: 215px;
  object-fit: cover;
  display: block;
}

.card-content { padding: 19px; }

.card h3 {
  color: var(--green);
  margin: 0 0 10px;
  font-size: 21px;
}

.card p {
  color: #666;
  line-height: 1.5;
  min-height: 44px;
}

.meta {
  color: #777;
  font-size: 14px;
  margin: 12px 0;
}

.view-btn {
  border: none;
  background: transparent;
  color: var(--green);
  font-weight: bold;
  cursor: pointer;
  font-size: 15px;
  padding: 8px 0;
}

.view-btn:hover { color: var(--orange); }

.no-results {
  display: none;
  text-align: center;
  padding: 30px;
  grid-column: 1 / -1;
}

.about {
  background: #edf3e8;
  text-align: center;
  line-height: 1.8;
}

.about p {
  max-width: 750px;
  margin: 15px auto;
}

footer {
  background: var(--green);
  color: white;
  text-align: center;
  padding: 25px;
  line-height: 1.8;
}

/* Recipe popup */

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: #0009;
  padding: 20px;
  overflow-y: auto;
}

.modal-box {
  background: white;
  max-width: 750px;
  margin: 25px auto;
  padding: 25px;
  border-radius: 15px;
  position: relative;
}

.modal-box img {
  width: 100%;
  height: 260px;
  object-fit: cover;
  border-radius: 10px;
}

.close {
  float: right;
  border: 0;
  background: #f2f2f2;
  padding: 8px 13px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
}

.modal h2 { color: var(--green); }
.modal li { margin-bottom: 9px; line-height: 1.5; }

@media (max-width: 800px) {
  .recipes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  header { justify-content: center; text-align: center; }
  .hero { background-position: 60% center; }
}

@media (max-width: 520px) {
  .recipes { grid-template-columns: 1fr; }
  nav a { display: inline-block; margin: 7px; }
  .hero { padding: 45px 6%; }
  .hero-content { background: #fff7e9dd; padding: 15px; border-radius: 12px; }
  section { padding: 35px 5%; }
  .search-area { flex-wrap: wrap; }
}
</style>
</head>

<body>

<header>
  <div class="logo">🍳 Naaz <span>Cooking</span></div>
  <nav>
    <a href="#home">Home</a>
    <a href="#recipes">Recipes</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<main>
<section class="hero" id="home">
  <div class="hero-content">
    <p>WELCOME TO MY KITCHEN</p>
    <h1>Naaz Cooking</h1>
    <p>Discover delicious recipes, simple cooking tips,
    and homemade food made with love!</p>
    <a href="#recipes" class="btn">Explore Recipes →</a>
  </div>
</section>

<section id="recipes">
  <h2 class="section-title">Our Delicious Recipes</h2>
  <p class="subtitle">Find your favourite dish and start cooking!</p>

  <div class="search-area">
    <input id="search" type="search"
      placeholder="Search dishes, e.g. biryani..."
      aria-label="Search recipes">
    <button class="btn" onclick="filterRecipes()">Search</button>
  </div>

  <div class="categories">
    <button class="category active" onclick="setCategory('All', this)">All</button>
    <button class="category" onclick="setCategory('Main Course', this)">Main Course</button>
    <button class="category" onclick="setCategory('Breakfast', this)">Breakfast</button>
    <button class="category" onclick="setCategory('Dessert', this)">Desserts</button>
    <button class="category" onclick="setCategory('Snacks', this)">Snacks</button>
  </div>

  <div class="recipes" id="recipeList"></div>
</section>

<section class="about" id="about">
  <h2 class="section-title">About Naaz Cooking</h2>
  <p>
    Welcome to Naaz Cooking! This website shares tasty homemade
    recipes with easy-to-follow instructions. Whether you are a
    beginner or an experienced cook, discover dishes you can prepare
    and enjoy with your family.
  </p>
  <p>Our motto: Good food, happy hearts! ❤️</p>
</section>

<section id="contact" style="text-align:center">
  <h2 class="section-title">Contact Us</h2>
  <p>Have a recipe suggestion? We would love to hear from you!</p>
  <p>Email: <a href="mailto:naazcooking@example.com">
    naazcooking@example.com</a></p>
  <p style="color:#777;font-size:14px">
    Replace this example email with your own email address.
  </p>
</section>
</main>

<footer>
  <strong>🍳 Naaz Cooking</strong>
  <p>Made with ❤️ for food lovers</p>
  <p>© 2026 Naaz Cooking. All rights reserved.</p>
</footer>

<div class="modal" id="recipeModal" role="dialog"
  aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <button class="close" onclick="closeRecipe()"
      aria-label="Close recipe">✕</button>
    <div id="recipeDetails"></div>
  </div>
</div>

<script>
const recipes = [
{
  name: "Paneer Butter Masala",
  category: "Main Course",
  time: "35 minutes",
  serves: "4 people",
  image: "https://images.unsplash.com/photo-1631452180519-c014fe946bc7?auto=format&fit=crop&w=800&q=80",
  description: "Soft paneer in a rich, creamy tomato gravy.",
  ingredients: [
    "250 g paneer, cubed",
    "3 tomatoes, chopped",
    "1 onion, chopped",
    "1 tbsp ginger-garlic paste",
    "2 tbsp butter",
    "2 tbsp cream",
    "1 tsp garam masala",
    "Salt and chilli powder to taste"
  ],
  steps: [
    "Heat butter in a pan and sauté the onion.",
    "Add ginger-garlic paste and chopped tomatoes. Cook until soft.",
    "Blend the mixture into a smooth gravy.",
    "Return the gravy to the pan and add spices and salt.",
    "Add paneer cubes and simmer for 5–8 minutes.",
    "Stir in cream and serve hot with naan or rice."
  ]
},
{
  name: "Veg Biryani",
  category: "Main Course",
  time: "45 minutes",
  serves: "4 people",
  image: "https://images.unsplash.com/photo-1589302168068-964664d93dc0?auto=format&fit=crop&w=800&q=80",
  description: "Fragrant rice cooked with vegetables and aromatic spices.",
  ingredients: [
    "2 cups basmati rice",
    "2 cups mixed vegetables",
    "1 onion, sliced",
    "1 tomato, chopped",
    "2 tbsp oil or ghee",
    "1 tsp biryani masala",
    "Whole spices and salt",
    "Fresh coriander and mint"
  ],
  steps: [
    "Wash and soak the rice for 20 minutes.",
    "Heat oil and sauté sliced onions with whole spices.",
    "Add tomatoes, vegetables, biryani masala and salt.",
    "Add drained rice and the appropriate amount of water.",
    "Cover and cook on low heat until the rice is tender.",
    "Garnish with coriander and mint, then serve."
  ]
},
{
  name: "Masala Dosa",
  category: "Breakfast",
  time: "30 minutes",
  serves: "3 people",
  image: "https://images.unsplash.com/photo-1668236543090-82eba5ee5976?auto=format&fit=crop&w=800&q=80",
  description: "Crispy dosa filled with delicious spiced potatoes.",
  ingredients: [
    "Dosa batter, as needed",
    "3 boiled potatoes",
    "1 onion, sliced",
    "1 green chilli",
    "1/2 tsp mustard seeds",
    "Curry leaves",
    "Oil and salt"
  ],
  steps: [
    "Mash the boiled potatoes.",
    "Heat oil and add mustard seeds and curry leaves.",
    "Add onion and chilli; cook until softened.",
    "Mix in potatoes and salt to make the filling.",
    "Spread dosa batter thinly on a hot greased pan.",
    "Add the potato filling, fold and serve with chutney."
  ]
},
{
  name: "Gulab Jamun",
  category: "Dessert",
  time: "40 minutes",
  serves: "4 people",
  image: "https://images.unsplash.com/photo-1666190092159-4c5f0e1b0b1a?auto=format&fit=crop&w=800&q=80",
  description: "Soft, sweet dumplings soaked in fragrant sugar syrup.",
  ingredients: [
    "1 cup milk powder",
    "3 tbsp flour",
    "A pinch of baking soda",
    "Milk, as needed",
    "1 cup sugar",
    "1 cup water",
    "Cardamom",
    "Oil or ghee for frying"
  ],
  steps: [
    "Boil sugar and water with cardamom to prepare syrup.",
    "Mix milk powder, flour and baking soda.",
    "Add a little milk and form a soft dough.",
    "Shape into small smooth balls without cracks.",
    "Fry on low heat until evenly golden brown.",
    "Soak the warm balls in warm syrup for at least 20 minutes."
  ]
},
{
  name: "Samosa",
  category: "Snacks",
  time: "45 minutes",
  serves: "4 people",
  image: "https://images.unsplash.com/photo-1601050690597-df0568f70950?auto=format&fit=crop&w=800&q=80",
  description: "Crispy pastry filled with spiced potatoes and peas.",
  ingredients: [
    "2 cups all-purpose flour",
    "3 boiled potatoes",
    "1/2 cup peas",
    "1 tsp cumin seeds",
    "1 tsp coriander powder",
    "Chilli powder and salt",
    "Oil for frying"
  ],
  steps: [
    "Mix flour with salt and a little oil; add water to make a firm dough.",
    "Mash potatoes and mix with peas and spices.",
    "Roll the dough and cut into semicircles.",
    "Shape each piece into a cone and fill with potato mixture.",
    "Seal the edges firmly.",
    "Deep-fry on medium-low heat until golden and crispy."
  ]
},
{
  name: "Chocolate Cake",
  category: "Dessert",
  time: "50 minutes",
  serves: "6 people",
  image: "https://images.unsplash.com/photo-1578985545062-69928b1d9587?auto=format&fit=crop&w=800&q=80",
  description: "A soft, rich chocolate cake for every celebration.",
  ingredients: [
    "1 cup flour",
    "1/3 cup cocoa powder",
    "3/4 cup sugar",
    "1 tsp baking powder",
    "2 eggs",
    "1/2 cup milk",
    "1/3 cup oil",
    "1 tsp vanilla extract"
  ],
  steps: [
    "Preheat the oven to 180°C.",
    "Mix flour, cocoa powder, sugar and baking powder.",
    "In another bowl, whisk eggs, milk, oil and vanilla.",
    "Combine the wet and dry ingredients without overmixing.",
    "Pour into a greased cake tin.",
    "Bake for approximately 25–35 minutes, until a skewer comes out clean."
  ]
}
];

let selectedCategory = "All";

function renderRecipes() {
  const query = document.getElementById("search").value
    .trim().toLowerCase();

  const list = document.getElementById("recipeList");
  list.innerHTML = "";

  const filtered = recipes.filter(recipe => {
    const matchesCategory = selectedCategory === "All" ||
      recipe.category === selectedCategory;
    const matchesSearch = (recipe.name + " " +
      recipe.description + " " + recipe.category)
      .toLowerCase().includes(query);
    return matchesCategory && matchesSearch;
  });

  if (filtered.length === 0) {
    list.innerHTML = '<p class="no-results" style="display:block">No recipes found. Try another search.</p>';
    return;
  }

  filtered.forEach(recipe => {
    const card = document.createElement("article");
    card.className = "card";

    const img = document.createElement("img");
    img.src = recipe.image;
    img.alt = recipe.name;
    img.loading = "lazy";
    img.onerror = () => {
      img.style.display = "none";
    };

    const content = document.createElement("div");
    content.className = "card-content";

    const title = document.createElement("h3");
    title.textContent = recipe.name;

    const desc = document.createElement("p");
    desc.textContent = recipe.description;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "⏱ " + recipe.time +
      " · 🍽 " + recipe.serves;

    const button = document.createElement("button");
    button.className = "view-btn";
    button.textContent = "View Recipe →";
    button.onclick = () => showRecipe(recipe.name);

    content.append(title, desc, meta, button);
    card.append(img, content);
    list.appendChild(card);
  });
}

function filterRecipes() {
  renderRecipes();
}

function setCategory(category, button) {
  selectedCategory = category;

  document.querySelectorAll(".category").forEach(btn => {
    btn.classList.remove("active");
  });
  button.classList.add("active");

  renderRecipes();
}

function showRecipe(name) {
  const recipe = recipes.find(item => item.name === name);
  if (!recipe) return;

  const details = document.getElementById("recipeDetails");
  details.replaceChildren();

  const image = document.createElement("img");
  image.src = recipe.image;
  image.alt = recipe.name;

  const title = document.createElement("h2");
  title.id = "modalTitle";
  title.textContent = recipe.name;

  const info = document.createElement("p");
  info.textContent = "⏱ " + recipe.time +
    " | 🍽 " + recipe.serves;

  const description = document.createElement("p");
  description.textContent = recipe.description;

  const ingredientsTitle = document.createElement("h3");
  ingredientsTitle.textContent = "Ingredients";

  const ingredientsList = document.createElement("ul");
  recipe.ingredients.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    ingredientsList.appendChild(li);
  });

  const stepsTitle = document.createElement("h3");
  stepsTitle.textContent = "Step-by-Step Instructions";

  const stepsList = document.createElement("ol");
  recipe.steps.forEach(item => {
    const li = document.createElement("li");
    li.textContent = item;
    stepsList.appendChild(li);
  });

  details.append(
    image, title, info, description,
    ingredientsTitle, ingredientsList,
    stepsTitle, stepsList
  );

  document.getElementById("recipeModal").style.display = "block";
  document.body.style.overflow = "hidden";
}

function closeRecipe() {
  document.getElementById("recipeModal").style.display = "none";
  document.body.style.overflow = "";
}

document.getElementById("search").addEventListener("input", renderRecipes);

document.getElementById("recipeModal").addEventListener("click", event => {
  if (event.target.id === "recipeModal") closeRecipe();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeRecipe();
});

renderRecipes();
</script>

</body>
</html>

